<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- A horseshoe magnet pulling a cube-shaped carton up its field lines, in the
       Iris theme. Inside the app these colours are swapped for the theme's
       (src/icons.rs, `logo_svg`): #7278fe, #c688d6 and #a85eea are the
       theme's paint a, b and c; the rest are mixed from them there
       (#18183c and #0b0c18 the tile, #eaebff the poles, #baa6f0 the field
       lines and carton, #372a66 and #1c163b the carton's fill). Keep them
       distinct, and write any other colour in three-digit form. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18183c"/>
      <stop offset="1" stop-color="#0b0c18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".3" r=".7">
      <stop offset="0" stop-color="#7278fe" stop-opacity=".32"/>
      <stop offset="1" stop-color="#7278fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="magnet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c688d6"/>
      <stop offset=".5" stop-color="#a85eea"/>
      <stop offset="1" stop-color="#7278fe"/>
    </linearGradient>
    <linearGradient id="carton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#372a66"/>
      <stop offset="1" stop-color="#1c163b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <path d="M78 122 V102 A50 50 0 0 1 178 102 V122" fill="none" stroke="url(#magnet)" stroke-width="32"/>
  <path d="M78 122 V146 M178 122 V146" stroke="#eaebff" stroke-width="32"/>
  <path d="M84 68 A44 44 0 0 1 120 52" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  <g fill="none" stroke="#baa6f0" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round" opacity=".6">
    <path d="M92 160 Q128 178 164 160"/>
    <path d="M84 167 Q128 196 172 167"/>
  </g>
  <g transform="translate(128 204) rotate(6) scale(1.2) translate(-128 -204)" stroke="#baa6f0" stroke-width="4" stroke-linejoin="round">
    <path d="M128 176 L158 190 L128 204 L98 190 Z" fill="#372a66"/>
    <path d="M128 176 L158 190 L128 204 L98 190 Z" fill="#baa6f0" fill-opacity=".25"/>
    <path d="M98 190 L128 204 V236 L98 222 Z" fill="#1c163b"/>
    <path d="M158 190 L128 204 V236 L158 222 Z" fill="#372a66"/>
  </g>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
</svg>

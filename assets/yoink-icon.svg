<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- A prize claw lifting a crate, drawn as "Detail A" of a blueprint.
       Inside the app these four colours are swapped for the theme's
       (src/icons.rs, `logo_svg`): #0b2a4a paper, #2a5a8c grid,
       #7fb2ff line work, #e8f1ff ink. Keep them distinct. -->
  <defs>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 14 0 H 0 V 14" fill="none" stroke="#2a5a8c" stroke-width="1"/>
    </pattern>
    <clipPath id="disc"><circle cx="128" cy="128" r="112"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="112" fill="#0b2a4a"/>
  <rect width="256" height="256" fill="url(#grid)" clip-path="url(#disc)"/>
  <g transform="translate(128 132) scale(1.12) translate(-128 -116)">
    <g fill="none" stroke="#e8f1ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 128 18 V 86"/>
      <rect x="104" y="128" width="48" height="44" rx="2" fill="#e8f1ff" fill-opacity="0.12"/>
      <path d="M 128 128 V 172" stroke-width="2.75" stroke-dasharray="4 4"/>
      <rect x="98" y="86" width="60" height="24" rx="5" fill="#0b2a4a"/>
      <path d="M 110 110 Q 84 134 97 160 L 108 160"/>
      <path d="M 146 110 Q 172 134 159 160 L 148 160"/>
    </g>
    <g fill="#0b2a4a" stroke="#e8f1ff" stroke-width="3.3">
      <circle cx="110" cy="110" r="4.5"/>
      <circle cx="146" cy="110" r="4.5"/>
    </g>
  </g>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#7fb2ff" stroke-width="5"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#7fb2ff" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="186" y="200" width="44" height="30" rx="4" fill="#0b2a4a" stroke="#7fb2ff" stroke-width="3"/>
  <path d="M 201 224 L 208 205 L 215 224 M 203.6 217.5 H 212.4" fill="none" stroke="#e8f1ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

name: Build

# Tests, then builds the AppImage and the Android APK on every push: kept
# as workflow artifacts (Yoink's own "dev builds" channel), and attached to
# the release for v* tags.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The oldest supported runner, so the binary runs on older distributions
    # too (glibc 2.35 or newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: AppImage
        run: |
          set -eux
          app=AppDir
          mkdir -p $app/usr/bin $app/usr/share/applications $app/usr/share/icons/hicolor/scalable/apps
          cp target/release/yoink $app/usr/bin/
          cp packaging/yoink.desktop $app/
          cp packaging/yoink.desktop $app/usr/share/applications/
          cp assets/yoink-icon.svg $app/yoink.svg
          cp assets/yoink-icon.svg $app/usr/share/icons/hicolor/scalable/apps/yoink.svg
          ln -s yoink.svg $app/.DirIcon
          cat > $app/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/yoink" "$@"
          RUN
          chmod +x $app/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream $app Yoink-x86_64.AppImage
          ls -l Yoink-x86_64.AppImage
          file Yoink-x86_64.AppImage
      - name: Check the libraries it needs
        # Only libraries every Linux desktop has.
        run: |
          readelf -d target/release/yoink | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tee needed.txt
          allowed='^(libc|libm|libdl|libpthread|librt|libgcc_s|libstdc\+\+|libfontconfig|libfreetype|libz|ld-linux-x86-64)\.so'
          if grep -Ev "$allowed" needed.txt; then
            echo "unexpected shared libraries above" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Yoink-x86_64.AppImage
          path: Yoink-x86_64.AppImage
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Yoink-x86_64.AppImage

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        # With the secrets set, every build is signed with the same key, so
        # each one installs as an update of the last. Without them, the
        # runner's throwaway debug key signs it (installable, not updatable).
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yoink.jks"
            echo "YOINK_KEYSTORE=$RUNNER_TEMP/yoink.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key"
          fi
      - name: Test and build
        env:
          YOINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YOINK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YOINK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Yoink-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yoink-android.apk
          path: android/Yoink-android.apk
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/Yoink-android.apk

name: Build

# Tests, then builds the Linux binary and the Android APK on every push: kept
# as workflow artifacts (Yoink's own "dev builds" channel), and attached to
# the release for v* tags.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The oldest supported runner, so the binary runs on older distributions
    # too (glibc 2.35 or newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        # <App>-<version>-<platform>-<architecture>.tar.gz: a v* tag's version,
        # or the crate's and the commit (as the APK's name has it). It holds
        # the binary as `yoink`, the name it is typed by.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-$(git rev-parse --short HEAD)"
          fi
          pkg="Yoink-$version-linux-x86_64.tar.gz"
          mkdir -p package
          install -m755 target/release/yoink package/yoink
          file package/yoink
          tar -C package -czf "$pkg" yoink
          tar -tvzf "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: Check the libraries it needs
        # Only libraries every Linux desktop has.
        run: |
          readelf -d target/release/yoink | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | tee needed.txt
          allowed='^(libc|libm|libdl|libpthread|librt|libgcc_s|libstdc\+\+|libfontconfig|libfreetype|libz|ld-linux-x86-64)\.so'
          if grep -Ev "$allowed" needed.txt; then
            echo "unexpected shared libraries above" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: ${{ env.PKG }}
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        # With the secrets set, builds are signed with that private key.
        # Without them, with the dev keystore in the repository: either way
        # every build is signed with the same key, so each one installs as
        # an update of the last.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yoink.jks"
            echo "YOINK_KEYSTORE=$RUNNER_TEMP/yoink.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the dev keystore in the repository"
          fi
      - name: Test and build
        env:
          YOINK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YOINK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YOINK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Gradle names the version (the crate's and the commit); a tag gives its own.
          if [ "$GITHUB_REF_TYPE" = tag ]; then export YOINK_VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/Yoink-*.apk .
          echo "APK=$(basename Yoink-*.apk)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: android/${{ env.APK }}
          if-no-files-found: error
          compression-level: 0
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ env.APK }}

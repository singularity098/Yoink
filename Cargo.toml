[package]
name = "yoink"
description = "An ad-hoc package manager for apps, plugins and APKs published on GitHub"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/singularity098/Yoink"
rust-version = "1.88"

[features]
default = ["skia"]
# Skia antialiases curves and thin lines far better than femtovg (as in
# Chippy). Build with `--no-default-features` to use femtovg only.
skia = ["slint/renderer-skia-opengl"]

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossbeam-channel = "0.5"
regex = "1"
sha2 = "0.10"
hex = "0.4"
# HTTPS with rustls (no OpenSSL).
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "json", "gzip"] }
# The token in the desktop's keyring (Secret Service over D-Bus, in Rust).
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
# Packages: zip, tar (gz, xz, zst, bz2) and 7z, all in Rust.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
lzma-rs = "0.3"
ruzstd = "0.7"
bzip2-rs = "0.1"
sevenz-rust2 = { version = "0.13", default-features = false, features = ["util", "deflate"] }
# Reading the desktop entry and icon inside an AppImage.
backhand = { version = "0.20", default-features = false, features = ["gzip-zlib-rs", "xz-static", "zstd"] }
slint = { version = "~1.14", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "image-default-formats",
    "unstable-winit-030",
] }
# The system's folder picker (XDG portal).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "~1.14"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "yoink"
path = "src/main.rs"
